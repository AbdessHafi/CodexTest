services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pause
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pause_local}
      POSTGRES_DB: pause
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pause -d pause"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
